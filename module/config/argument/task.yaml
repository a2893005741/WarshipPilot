tasks:
  general:
    name: 通用设置
    executable: false
    help: 原脚本的修理、舰船处理与记录设置，保留配置供后续任务接入。
  control:
    name: 功能控制台
    executable: false
    help: 原脚本的前后方案与远征开关，保留配置供后续任务接入。
  expedition:
    name: 远征
    executable: true
    help: 收取已完成远征，并由原舰队继续派遣。
  campaign:
    name: 战役
    executable: true
    help: 使用原脚本打战役：按所选章节和难度打完当天次数，有船泡澡时稍后继续，次日计划时间再运行。
  reward:
    name: 任务奖励
    executable: true
    help: 使用原脚本收任务：港区任务按钮有红点时进入任务页一键领取，没有红点不操作。
  exercise:
    name: 演习
    executable: true
    help: 使用原脚本打演习：按所选舰队、阵型和避潜艇设置打完两页可挑战对手，回港后等待 0、12、18 点刷新。沿用原快修及夜战流程。
  sortie_a:
    name: 方案 A
    executable: false
    help: 保存原脚本方案 A 参数；本版尚未接入执行。
  sortie_b:
    name: 方案 B
    executable: false
    help: 保存原脚本方案 B 参数；本版尚未接入执行。
  sortie:
    name: 方案 C
    executable: true
    help: 使用原脚本方案 C 执行出征，修改的方案参数在下次任务启动时使用。
  decisive:
    name: 决战
    executable: true
    help: 使用原脚本决战：按决战方案选关，战备舰队优先选潜艇和指定舰船，满编后选 BUFF，道中与 BOSS 分别按阵型、夜战和快修设置作战，捞到的目标舰船自动上锁。打到每日限制次数或决战票用完后回港，次日再检查。
