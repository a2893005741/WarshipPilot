[project]
name = "warshippilot"
version = "0.4.0"
description = "舰R助手：原Lua脚本电脑端远征与出征"
requires-python = ">=3.14,<3.15"
dependencies = [
    "starlette>=0.48,<1",
    "uvicorn>=0.38,<1",
    "pydantic>=2.12,<3",
    "pillow>=12,<13",
    "numpy>=2.3,<3",
    "opencv-python-headless>=4.12,<5",
    "wsproto>=1.3.2",
    "lupa>=2.6,<3",
]

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

